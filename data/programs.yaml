  # =========================================================== GLP-1s in T1D
  - id: lilly-tirzepatide-t1d
    section: glp1
    glp1_topic: adjunct
    name: Tirzepatide (Mounjaro/Zepbound) — SURPASS-T1D program
    company: Eli Lilly
    ticker: LLY
    modality: Weekly GIP/GLP-1 dual agonist, added to insulin
    population: Adults with T1D and obesity or overweight
    stage: phase3
    evidence: phase2
    status: active
    nct_ids: [NCT06914895, NCT06962280, NCT07803744]
    endpoints:
      - metric: Body weight (12 wk, Phase 2, n=24)
        result: −8.7 kg vs placebo (95% CI −12.0 to −5.5)
      - metric: HbA1c
        result: −0.4 pts vs placebo (95% CI −0.7 to 0.0; P=0.05, borderline)
      - metric: Total daily insulin
        result: −35.1% vs placebo
      - metric: Severe hypo / DKA
        result: None reported in either arm (small, short study)
    summary: >-
      Lilly is running the first industry-sponsored Phase 3 program of a GLP-1-class drug
      in T1D since Novo Nordisk's liraglutide ADJUNCT trials (SURPASS-T1D-1 and -2). The endpoint figures above are from the independent
      Phase 2 (Snaith et al., Diabetes Care 2026).
    reality_check: >-
      This is the most credible route to the first GLP-1-class T1D label. The Phase 2 had
      only 24 patients over 12 weeks, so the Phase 3 safety data (DKA, hypoglycemia) is
      what will decide it.
    next_catalyst:
      label: SURPASS-T1D-1 primary completion (registry estimate)
      date: null
      nct_id: NCT06914895
    sources:
      - label: Diabetes Care 2026 — Phase 2 RCT (PMID 41264593)
        url: https://doi.org/10.2337/dc25-2379
      - label: Lilly trial page — SURPASS-T1D-1
        url: https://trials.lilly.com/en-US/trial/589916
      - label: ClinicalTrials.gov NCT06914895
        url: https://clinicaltrials.gov/study/NCT06914895
    verified_on: 2026-10-24

  - id: semaglutide-adjust-t1d
    section: glp1
    glp1_topic: adjunct
    name: Semaglutide — ADJUST-T1D (investigator-led)
    company: Novo Nordisk (drug); academic sponsor
    ticker: NVO
    modality: Weekly GLP-1 RA up to 1 mg, added to automated insulin delivery
    population: Adults with T1D and obesity on AID
    stage: phase3  # academic Phase 3 (CV outcomes, NCT05819138); no Novo registration program
    evidence: phase2
    status: active
    nct_ids: [NCT05819138, NCT06411210, NCT07891156]
    endpoints:
      - metric: Composite (TIR>70%, TBR<4%, ≥5% weight loss), 26 wk, n=72
        result: 36% vs 0% placebo
      - metric: Time in range (70–180)
        result: +8.8 pts vs placebo (95% CI 3.9 to 13.7)
      - metric: HbA1c
        result: −0.3 pts vs placebo
      - metric: Body weight
        result: −8.8 kg vs placebo
      - metric: Severe hypo / DKA
        result: 2 severe hypo events per arm; no DKA
    summary: >-
      Randomized trial published in NEJM Evidence (2025); a 2026 Diabetes Care analysis
      examined insulin-dose reduction. Several academic follow-ons are registered,
      including a semaglutide cardiovascular-outcomes study in T1D (NCT05819138).
    reality_check: >-
