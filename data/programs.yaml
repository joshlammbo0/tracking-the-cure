  # ------------------------------------------------ immune / disease-modifying
  - id: sanofi-teplizumab
    section: cure
    approach: immune
    name: Teplizumab (Tzield; Teizeild in EU)
    company: Sanofi
    ticker: SNY
    modality: Anti-CD3 monoclonal antibody, 14-day IV course
    population: Stage 2 T1D age 8+ (full approval); recently diagnosed stage 3 T1D age 8–17 (accelerated approval, Jun 2026)
    stage: approved
    evidence: approved
    status: active
    nct_ids: [NCT07088068, NCT06791291, NCT07216391, NCT03875729]
    summary: >-
      FDA-approved (Nov 2022) to delay stage 3 T1D in stage 2 patients age 8+, based on
      TN-10 (median delay of about 2 years). EU approval came in Jan 2026. On Jun 12, 2026
      the FDA granted accelerated approval to slow the decline of insulin production in
      children age 8–17 recently diagnosed with stage 3 T1D. That approval rests on a
      C-peptide surrogate endpoint, and a post-approval study must confirm clinical
      benefit. In the earlier PROTECT Phase 3 (new-onset), teplizumab met its C-peptide
      primary endpoint but did not separate on clinical secondary endpoints. A new Phase 3
      (βETA PRESERVE, age 1–25) is enrolling.
    reality_check: >-
      It's the only approved disease-modifying T1D drug, and now it's approved both before
      and just after diagnosis. It slows the disease rather than curing it, and the new-onset
      label is accelerated on a surrogate endpoint. If the confirmatory study fails, the FDA
      can withdraw it.
    next_catalyst:
      label: βETA PRESERVE Phase 3 primary completion (registry estimate)
      date: null  # pulled live from ClinicalTrials.gov
      nct_id: NCT07088068
    sources:
      - label: FDA — accelerated approval, recently diagnosed stage 3, age 8–17 (Jun 2026)
        url: https://www.fda.gov/news-events/press-announcements/fda-approves-new-indication-tzield-teplizumab-certain-pediatric-patients-recently-diagnosed-stage-3
      - label: FDA approval announcement (Nov 2022)
        url: https://www.fda.gov/media/164864/download
      - label: Sanofi — EU approval (6-K, Jan 2026)
        url: https://www.sec.gov/Archives/edgar/data/1121404/000119312526014575/d100861dex991.htm
      - label: NEJM 2023 — PROTECT (PMID 37861217)
        url: https://doi.org/10.1056/NEJMoa2308743
      - label: NEJM 2019 — TN-10 at-risk relatives
        url: https://doi.org/10.1056/NEJMoa1902226
    unverified:
      - FDA's Jun 2026 release does not name the pivotal or confirmatory trial; βETA PRESERVE (NCT07088068) is a plausible confirmatory study but this is not confirmed.
    verified_on: 2026-10-24

  - id: lilly-baricitinib
    section: cure
    approach: immune
    name: Baricitinib (Olumiant) in T1D
    company: Eli Lilly
    ticker: LLY
    modality: Oral JAK1/2 inhibitor (already approved for other indications)
    stage: phase3
    evidence: phase2
    status: active
    nct_ids: [NCT07222332, NCT07222137, NCT04774224]
    summary: >-
      In the BANDIT Phase 2 (NEJM 2023), baricitinib preserved C-peptide versus placebo
      over 48 weeks in new-onset T1D. Lilly is now running two Phase 3s: new-onset beta-cell
      preservation, and delay of stage 3 in at-risk people.
    reality_check: >-
      An oral pill with a positive randomized trial behind it is a real step. The open
      questions are durability after stopping, and JAK-class safety in kids.
    next_catalyst:
      label: Phase 3 (new-onset) primary completion (registry estimate)
      date: null
      nct_id: NCT07222332
    sources:
      - label: NEJM 2023 — BANDIT (PMID 38055252)
        url: https://doi.org/10.1056/NEJMoa2306691
      - label: ClinicalTrials.gov NCT07222332
        url: https://clinicaltrials.gov/study/NCT07222332
      - label: ClinicalTrials.gov NCT07222137
        url: https://clinicaltrials.gov/study/NCT07222137
    verified_on: 2026-10-24

