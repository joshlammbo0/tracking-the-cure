  # ---------------------------------------------------- gene-edited / immune-evasive
  - id: sana-up421
    section: cure
    approach: gene_edited
    name: UP421 (investigator-sponsored)
    company: Sana Biotechnology / Uppsala University
    ticker: SANA
    modality: Hypoimmune (HIP)-edited primary donor islets, intramuscular, no immunosuppression
    stage: phase1
    evidence: phase1
    status: active
    nct_ids: [NCT06239636]
    summary: >-
      First-in-human study at Uppsala. Sana reported surviving, insulin-producing cells and
      no immunosuppression through 14 months in the first patient; long-term follow-up was
      published as an NEJM correspondence in 2026.
    reality_check: >-
      This is a single patient at a low, sub-therapeutic dose, so it's proof of the concept
      of hiding cells from the immune system, not proof of a cure. It's still a real first.
    next_catalyst: null
    sources:
      - label: NEJM 2026 — Long-Term Survival of Hypoimmune Allogeneic Islets without Immunosuppression (PMID 42430558)
        url: https://doi.org/10.1056/NEJMc2604408
