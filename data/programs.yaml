# Curated cure-pipeline and GLP-1-in-T1D programs.
#
# Each record is hand-verified against primary sources (ClinicalTrials.gov, company
# releases / SEC filings, FDA, peer-reviewed papers). The daily pipeline layers live
# registry data on top (status, phase, dates) and raises flags when the two disagree.
#
# Grades (use exactly these): preclinical | phase1 | phase2 | phase3 | filed | approved
#   stage    = furthest point of active development (e.g. a Phase 3 trial enrolling)
#   evidence = highest-quality human data actually read out (the hype filter)
# status:  active | paused | discontinued
# unverified: list anything you could not confirm; it is shown on the site as a flag.

programs:

  # ---------------------------------------------------------------- cell replacement
  - id: vertex-zimislecel
    section: cure
    approach: cell_replacement
    name: Zimislecel (VX-880)
    company: Vertex Pharmaceuticals
    ticker: VRTX
    modality: Fully differentiated stem-cell-derived islets, infused into the portal vein
    population: T1D with impaired hypoglycemia awareness and severe hypoglycemia
    stage: phase3
    evidence: phase2
    status: active
    nct_ids: [NCT04786262, NCT06832410]
    summary: >-
      Phase 1/2/3 master protocol (FORWARD). In the NEJM report, 10 of 12 full-dose
      participants were insulin-independent at day 365; all 12 had HbA1c <7% and no severe
      hypoglycemia. Requires chronic immunosuppression; two deaths were reported in the
      study (cryptococcal meningitis; progression of pre-existing neurocognitive disease).
      Vertex postponed completion of dosing in Jan 2026 for an internal manufacturing
      analysis, then resumed dosing; it said it will give updated timelines later in 2026.
    reality_check: >-
      The strongest cure-type data in the field, but it's a swap of insulin for lifelong
      immunosuppression, aimed first at the sickest ~60k patients. The 2026 filing goal
      has slipped and has no new date yet.
    next_catalyst:
      label: Updated zimislecel / VX-017 timelines
      date: 2026-12-31
      date_precision: guided  # "later this year" per Vertex Q2 2026 release
    sources:
      - label: NEJM 2025 — Stem Cell–Derived, Fully Differentiated Islets for T1D (PMID 40544428)
        url: https://doi.org/10.1056/NEJMoa2506549
      - label: Vertex Q1 2026 results (dosing resumed)
        url: https://investors.vrtx.com/news-releases/news-release-details/vertex-reports-first-quarter-2026-financial-results
      - label: Vertex Q2 2026 results (updated timelines later this year)
        url: https://news.vrtx.com/news-releases/news-release-details/vertex-reports-second-quarter-2026-financial-results
    verified_on: 2026-10-24

  - id: vertex-vx017
    section: cure
    approach: gene_edited
    name: VX-017
    company: Vertex Pharmaceuticals
    ticker: VRTX
    modality: Next-generation islet cell product, studied within the FORWARD master protocol
    stage: phase1
    evidence: preclinical
    status: active
    nct_ids: [NCT04786262]
    skip_checks: [registry_phase]  # shares the zimislecel Phase 1/2/3 master protocol
    summary: >-
      Listed as an intervention in Vertex's Phase 1/2/3 master protocol (NCT04786262).
      Vertex said in its Q2 2026 release that the FDA cleared the VX-017 IND and that it
      would accelerate the program.
    reality_check: >-
      No human data yet. Vertex has described it as a 'universal donor' approach, but
      the company hasn't disclosed engineering details we could check, so treat the
      label as a goal, not a result.
    next_catalyst:
      label: First VX-017 dosing / program timelines
      date: 2026-12-31
      date_precision: guided
    sources:
      - label: ClinicalTrials.gov master protocol listing VX-017
        url: https://clinicaltrials.gov/study/NCT04786262
      - label: Vertex Q2 2026 results
        url: https://news.vrtx.com/news-releases/news-release-details/vertex-reports-second-quarter-2026-financial-results
    unverified:
      - Exact mechanism / engineering of VX-017 is not described in a primary source we could find.
    verified_on: 2026-10-24

