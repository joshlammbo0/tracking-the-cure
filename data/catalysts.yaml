# Hand-curated catalysts. The pipeline ADDS:
#   - registry primary-completion dates for every tracked trial (ClinicalTrials.gov), as type trial_completion
#   - upcoming earnings dates for tracked tickers (yfinance)
#   - each program's next_catalyst from programs.yaml
# type: conference | fda | readout | trial_completion | company | launch
#   readout          = a results readout, ONLY when a source separate from the registry says results will be reported
#   trial_completion = a trial's primary / study completion date (not a results date)
# precision: exact | month | quarter | half | year | guided   (guided = company guidance, not a fixed date)
# provenance: Registry estimate | Company guidance | Confirmed. Leave it out when the source doesn't settle it;
#   the site then shows "Provenance not classified" instead of guessing.
# window: the timing exactly as the source words it (e.g. "end of 2027 or early 2028"). Shown instead of `date`,
#   which stays as a sortable placeholder at the end of the window.

