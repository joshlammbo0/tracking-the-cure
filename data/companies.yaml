# pulled live (yfinance); SEC filings are pulled from EDGAR by ticker.
# diabetes_rev_pct is hand-entered ONLY when disclosed or derivable from a filing;
# leave null otherwise — the site shows "not disclosed" rather than guessing.
#
# group: cgm_pump | pharma | cell_gene | immune
#
# exposure (optional) feeds the Cure Impact Model's company read-across: the fraction of
# the company's CURRENT total revenue that sits in each modelled market (cgm | pump | insulin).
#   basis: disclosed  = straight from a filing/release (source given)
#          derived    = arithmetic on disclosed or live figures (shown on the site)
#          assumption = a labelled judgment call (e.g. treating a segment as one market)
# Leave it out when no primary source supports a split; the site then shows "not modelled".

