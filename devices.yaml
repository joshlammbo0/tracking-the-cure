# Curated T1D medtech: CGMs, pumps, and automated insulin delivery (AID).
# FDA numbers/dates were checked against openFDA (510(k), De Novo, PMA databases).
# The daily pipeline separately pulls every new FDA decision in the relevant product
# codes, so new clearances show up on the site even before this file is edited.
#
# category: cgm | pump | aid_algorithm | other
# status:   marketed | cleared_not_launched | pipeline | discontinued
# Your personal "user's take" lives in data/my_notes.yaml (keyed by id), not here.

devices:

  # ------------------------------------------------------------------ CGMs
  - id: dexcom-g7
    company: Dexcom
    ticker: DXCM
    name: Dexcom G7 / G7 15 Day
    category: cgm
    status: marketed
    fda: K243214 (G7 15 Day, cleared 2025-04-09); G7 iCGM first cleared K213919 (2022-12-07)
    key_specs: iCGM; 10-day (G7) and 15-day wear (G7 15 Day, adults); integrates with major AID systems
    pipeline_note: G7 15 Day launched Dec 2025 per company reports.
    sources:
      - label: openFDA 510(k) K243214
        url: https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfpmn/pmn.cfm?ID=K243214
      - label: FDA clearance coverage (Fierce Biotech)
        url: https://www.fiercebiotech.com/medtech/dexcom-wins-fda-clearance-15-day-g7-cgm-sensor

  - id: dexcom-stelo
    company: Dexcom
    ticker: DXCM
    name: Stelo (OTC biosensor)
    category: cgm
    status: marketed
    fda: K234070 (first OTC CGM, 2024-03-05); additional 510(k)s in 2026 incl. K260935 (2026-06-12)
    key_specs: Over-the-counter; for people not using insulin. In 2026 it was cleared for age 2+.
    pipeline_note: Not for insulin users, so it's not a T1D device, but it matters for Dexcom's TAM.
    sources:
      - label: openFDA 510(k) K234070
        url: https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfpmn/pmn.cfm?ID=K234070
      - label: Dexcom ADA 2026 release
        url: https://investors.dexcom.com/news/news-details/2026/Dexcom-Reaffirms-CGM-Benefits-for-All-People-With-Diabetes-and-Continues-Momentum-Toward-Earlier-Stage-Intervention-and-Preventative-Care-at-ADA-2026/default.aspx

  - id: dexcom-smart-basal
    company: Dexcom
    ticker: DXCM
    name: Dexcom Smart Basal
    category: other
    status: cleared_not_launched
    fda: K252818 (2025-11-18, product code QRX)
    key_specs: Software for CGM-informed basal insulin dose titration
    pipeline_note: Aimed at basal-insulin users (largely T2D). We haven't verified the launch status.
    sources:
      - label: openFDA 510(k) K252818
        url: https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfpmn/pmn.cfm?ID=K252818

  - id: dexcom-g8
    company: Dexcom
    ticker: DXCM
    name: Dexcom G8 (pipeline)
    category: cgm
    status: pipeline
    fda: Not yet cleared
    key_specs: Company says it's about 50% smaller than G7
    pipeline_note: Company targets launch at the end of 2027 or early 2028 (May 2026 investor day).
    sources:
      - label: Dexcom investor relations
        url: https://investors.dexcom.com/

  - id: abbott-libre-duo
    company: Abbott
    ticker: ABT
    name: FreeStyle Libre Duo 10 Day (glucose + ketone)
    category: cgm
    status: cleared_not_launched
    fda: DEN250049 (De Novo, 2026-08-25, new product code SJD)
    key_specs: First integrated continuous glucose-ketone sensor; age 2+; 10-day wear
    pipeline_note: Continuous ketone sensing goes straight at DKA risk, which matters most for T1D and for GLP-1/SGLT2 adjunct use. US launch is planned for later in 2026.
    sources:
      - label: Abbott press release (Aug 25, 2026)
        url: https://abbott.mediaroom.com/2026-08-25-Abbott-receives-FDA-authorization-for-worlds-first-dual-glucose-ketone-sensing-technology-for-people-with-diabetes
      - label: openFDA De Novo DEN250049
        url: https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfpmn/denovo.cfm?ID=DEN250049

  - id: abbott-libre3plus
    company: Abbott
    ticker: ABT
    name: FreeStyle Libre 3 Plus / 2 Plus
    category: cgm
    status: marketed
    fda: iCGM (product code QBJ); see live FDA feed for latest 510(k)s
    key_specs: 15-day wear; integrates with Omnipod 5, Tandem, and Beta Bionics AID systems
    pipeline_note: Abbott Diabetes Care sales were about $8.0B in FY2025, roughly 18% of Abbott's total.
    sources:
      - label: Abbott Q4 / FY2025 results
        url: https://abbott.mediaroom.com/2026-01-22-Abbott-Reports-Fourth-Quarter-and-Full-Year-2025-Results-Issues-2026-Financial-Outlook
    unverified:
      - Specific 510(k) number for the current Libre 3 Plus labeling not pinned.

  - id: medtronic-simplera
    company: MiniMed (Medtronic)
    ticker: MMED
    name: Simplera Sync sensor
    category: cgm
    status: marketed
    fda: PMA P250012 (2025-08-06)
    key_specs: Disposable all-in-one sensor for use with the MiniMed 780G
    pipeline_note: MiniMed IPO'd in March 2026 (Nasdaq MMED). Medtronic still owns about 90%.
    sources:
      - label: openFDA PMA P250012
        url: https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfpma/pma.cfm?id=P250012

  - id: senseonics-eversense
    company: Senseonics
    ticker: SENS
    name: Eversense 365 (implantable CGM)
    category: cgm
    status: marketed
    fda: PMA P160048 (and supplements)
    key_specs: Implanted sensor with up to 1-year wear; removable on-body transmitter
    pipeline_note: The only long-term implantable CGM.
    sources:
      - label: openFDA PMA P160048
        url: https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfpma/pma.cfm?id=P160048
    unverified:
      - Approval date of the 365-day labeling not confirmed in openFDA supplement list.

  # ---------------------------------------------------- pumps & AID systems
  - id: medtronic-780g
    company: MiniMed (Medtronic)
    ticker: MMED
    name: MiniMed 780G
    category: pump
    status: marketed
    fda: PMA P160017/S091 (2023-04-21)
    key_specs: Tubed pump with SmartGuard AID algorithm, including auto-correction boluses
    pipeline_note: It's the only major AID system that isn't interoperable (ACE/iAGC) in the US.
    sources:
      - label: openFDA PMA P160017
        url: https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfpma/pma.cfm?id=P160017

  - id: insulet-omnipod5
    company: Insulet
    ticker: PODD
    name: Omnipod 5
    category: pump
    status: marketed
    fda: K203768 (pod, 2022-01-27); SmartAdjust T2D expansion K241777 (2024-08-26)
    key_specs: Tubeless patch pump; SmartAdjust AID algorithm; works with Dexcom and Libre
    pipeline_note: openFDA also lists an "Omnipod 6 algorithm" 510(k) (K261461, cleared 2026-06-29). Commercial plans haven't been verified.
    sources:
      - label: openFDA 510(k) K203768
        url: https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfpmn/pmn.cfm?ID=K203768
      - label: openFDA 510(k) K261461 (Omnipod 6 algorithm)
        url: https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfpmn/pmn.cfm?ID=K261461

  - id: tandem-mobi
    company: Tandem Diabetes Care
    ticker: TNDM
    name: Tandem Mobi / t:slim X2 with Control-IQ+
    category: pump
    status: marketed
    fda: Control-IQ+ K260429 (2026-04-24, adds pregnancy indication); Mobi K223213 (2023-07-10)
    key_specs: Mobi is the smallest durable tubed pump; Control-IQ+ cleared for T1D age 2+, T2D, and T1D pregnancy
    pipeline_note: Tandem has said it's developing a tubeless Mobi. Filing timing is company guidance.
    sources:
      - label: Tandem — Control-IQ+ cleared for pregnancy (Apr 2026)
        url: https://investor.tandemdiabetes.com/news-releases/news-release-details/tandem-diabetes-cares-control-iq-automated-insulin-delivery/
      - label: openFDA 510(k) K260429
        url: https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfpmn/pmn.cfm?ID=K260429

  - id: betabionics-ilet
    company: Beta Bionics
    ticker: BBNX
    name: iLet Bionic Pancreas
    category: pump
    status: marketed
    fda: iLet ACE pump K223846 and dosing software K220916 (both 2023-05-19)
    key_specs: Weight-initialized AID; no carb counting (meal announcement only)
    pipeline_note: Its "3D Intelligence" algorithm has been submitted for 510(k) (company-reported).
    sources:
      - label: openFDA 510(k) K220916
        url: https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfpmn/pmn.cfm?ID=K220916

  - id: betabionics-mint
    company: Beta Bionics
    ticker: BBNX
    name: Mint patch pump
    category: pump
    status: cleared_not_launched
    fda: K260001 (Mint ACE pump, 2026-09-11)
    key_specs: Patch pump with a reusable plus disposable design and no recharging; 3-day wear; 200-unit reservoir
    pipeline_note: Full US launch planned for Q1 2027, through the pharmacy channel only. It's a direct challenge to Omnipod.
    sources:
      - label: openFDA 510(k) K260001
        url: https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfpmn/pmn.cfm?ID=K260001
      - label: MedTech Dive coverage
        url: https://www.medtechdive.com/news/beta-bionics-insulin-patch-pump-gets-fda-nod/830332/

  - id: sequel-twiist
    company: Sequel Med Tech (private; DEKA-developed)
    ticker: null
    name: twiist AID system
    category: pump
    status: marketed
    fda: K250930 (2025-04-02); K261672 (2026-06-17), both filed by DEKA Research & Development
    key_specs: Tubed pump that measures insulin delivery acoustically; uses the Tidepool algorithm
    pipeline_note: A private challenger, so you can't invest in it directly.
    sources:
      - label: openFDA 510(k) K250930
        url: https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfpmn/pmn.cfm?ID=K250930
    unverified:
      - Commercial launch scope not verified from a primary source.
