name: Daily refresh & deploy

on:
  schedule:
    - cron: "17 11 * * *"   # daily, ~7am US Eastern
  push:
    branches: [main]
    paths: ["data/**", "pipeline/**", "site/**", "templates/**", "requirements.txt", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh data from primary sources
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python -m pipeline.build

      - name: Commit refreshed data
        run: |
          git config user.name "tracking-the-cure-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Daily data refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Render pages, model outputs, calendar and sitemap
        run: python -m pipeline.render

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
