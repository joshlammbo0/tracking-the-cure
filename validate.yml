name: Validate curated data

on:
  pull_request:
    paths: ["data/**", "pipeline/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Offline build: checks YAML schema + my_notes keys without hitting any API.
      - run: python -m pipeline.build --offline
