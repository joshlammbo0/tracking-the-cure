_comment: 'Owner-approved presentation text changes. Phase 1 (approved 2026-10-26): nav label ''GLP-1s'' -> ''GLP-1s in T1D'' in the More menu; footer now repeats the disclaimer bar''s second sentence.
  Phase 2 (approved 2026-10-26): new homepage H1; T1D-attributable baseline values, axis labels and approval marker in the hero chart; $3.2B figure and existing qualifier/caveat repeated in the hero; one
  text node split by formatting. Phase 2 captions approved 2026-10-26 (hero chart title, subtitle, caption, legend labels). Phase 3 (recorded 2026-10-26): model page reuses the approved homepage context
  chart strings; read-across bar values duplicate the read-across table; heatmap legend values duplicate heatmap cells. Phase 3 text approved 2026-10-26 (read-across chart title and caption, labels). Phase
  4 (recorded 2026-10-26): program-page ''Ahead of results'' values and pipeline matrix view re-display existing gap/grade data.'
